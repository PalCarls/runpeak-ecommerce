services:
  postgres:
    image: postgres:17-alpine
    container_name: runpeak-postgres
    restart: 'no'
    environment:
      POSTGRES_DB: runpeak
      POSTGRES_USER: runpeak
      POSTGRES_PASSWORD: runpeak_local_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - runpeak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runpeak -d runpeak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  runpeak_postgres_data:
